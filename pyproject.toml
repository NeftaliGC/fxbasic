[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fxbasic"
dynamic = ["version"]
description = "Envía programas Casio BASIC a calculadoras fx-9860G/fx-9750GII por USB (Protocol 7.00), sin FA-124 ni Windows."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "NeftaliGC" }]
dependencies = ["pyusb>=1.2"]
keywords = ["casio", "fx-9750gii", "fx-9860g", "casio-basic", "usb", "protocol7"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Environment :: Console",
    "Topic :: System :: Hardware",
]

[project.scripts]
fxbasic = "fxbasic.cli:main"

[tool.setuptools]
packages = ["fxbasic"]

[tool.setuptools.package-data]
fxbasic = ["chars.toml"]

[tool.setuptools.dynamic]
version = { attr = "fxbasic.__version__" }
