# Publica fxbasic en PyPI con Trusted Publishing (sin tokens).
#
# - Al publicar un release en GitHub, se sube a PyPI.
# - A mano (pestaña Actions > "Publicar en PyPI" > Run workflow) se puede
#   elegir TestPyPI o PyPI; sirve para probar y para versiones ya etiquetadas.
name: Publicar en PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      destino:
        description: "Dónde publicar"
        type: choice
        options: [testpypi, pypi]
        default: testpypi

jobs:
  compilar:
    name: Compilar el paquete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instalar build y twine
        run: python -m pip install --upgrade build twine

      - name: Comprobar que la etiqueta coincide con la versión
        if: github.event_name == 'release'
        run: |
          VERSION=$(python -c "import re; print(re.search(r'__version__ = \"(.+)\"', open('fxbasic/__init__.py').read()).group(1))")
          if [ "v$VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::La etiqueta ${GITHUB_REF_NAME} no coincide con __version__ = $VERSION"
            exit 1
          fi

      - name: Compilar sdist y wheel
        run: python -m build

      - name: Revisar los metadatos
        run: python -m twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    name: Publicar en TestPyPI
    if: github.event_name == 'workflow_dispatch' && inputs.destino == 'testpypi'
    needs: compilar
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/fxbasic
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: Publicar en PyPI
    if: github.event_name == 'release' || inputs.destino == 'pypi'
    needs: compilar
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/fxbasic
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
